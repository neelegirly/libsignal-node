# 📦 Release: veröffentlicht dieses Paket auf npm, sobald ein Versions-Tag vX.Y.Z gepusht wird.
#
# Anmeldung bei npm über Trusted Publishing (OIDC): kein Token im Repo, keine Repo-Secrets, kein Token auf dem Server.
# Einmalig je Paket einzurichten — auf npmjs.com (Paket → Settings → Trusted Publisher → GitHub Actions,
# Workflow-Datei release.yml, Environment leer) oder mit
#   npm trust github <paket> --file release.yml --repository <owner>/<repo> --allow-publish
# Ohne diese Einrichtung scheitert nur der letzte Schritt (npm publish); alles davor bleibt eine reine Prüfung.
#
# Der Tag muss auf main liegen und genau "v" + package.json-Version heißen; eine schon veröffentlichte Version
# bricht ab. Tests laufen vor dem Veröffentlichen mit frisch installierten Laufzeit-Abhängigkeiten.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Prüfen und auf npm veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Quelle holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 24 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm für Trusted Publishing (mindestens 11.5.1)
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e 'const v = process.argv[1].split(".").map(Number); process.exit(v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@11.21.3
          fi
          echo "node $(node --version), npm $(npm --version)"

      - name: Tag, Version und main prüfen
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json (${version})"
            exit 1
          fi
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${commit}) liegt nicht auf main"
            exit 1
          fi
          if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::${name}@${version} ist schon veröffentlicht"
            exit 1
          fi
          echo "${name}@${version} aus ${commit}"

      - name: Laufzeit-Abhängigkeiten frisch installieren
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Paketinhalt prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > "${RUNNER_TEMP}/pack.json"
          node - "${RUNNER_TEMP}/pack.json" <<'JS'
          const fs = require('fs')
          const [info] = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          // Laufzeitdaten und Schlüssel gehören nie ins Paket (Namen wie session_cipher.js oder auth-utils.js sind Quelltext und erlaubt)
          const verboten = [
            /(^|\/)\.env($|\.)/, /(^|\/)\.npmrc$/, /(^|\/)\.git\//, /(^|\/)node_modules\//, /(^|\/)\.github\//,
            /(^|\/)(sessions|auth_info[^/]*|baileys_auth_info|backups?)\//,
            /(^|\/)creds\.json$/, /(^|\/)(pre-key|session|sender-key|app-state-sync-key|app-state-sync-version)-[^/]*\.json$/,
            /\.(pem|key|p12|pfx|sqlite3?|db|tgz|log)$/i,
          ]
          const treffer = info.files.map(f => f.path).filter(p => verboten.some(r => r.test(p)))
          console.log(`${info.name}@${info.version}: ${info.entryCount} Dateien, ${info.size} Bytes gepackt, ${info.unpackedSize} entpackt`)
          if (treffer.length) {
            console.error('::error::Nicht erlaubte Dateien im Paket: ' + treffer.join(', '))
            process.exit(1)
          }
          if (info.size > 8 * 1024 * 1024) {
            console.error(`::error::Paket ist ${info.size} Bytes groß (Grenze 8 MiB)`)
            process.exit(1)
          }
          JS

      - name: Auf npm veröffentlichen (Trusted Publishing, Herkunftsnachweis automatisch)
        run: npm publish --access public --ignore-scripts
